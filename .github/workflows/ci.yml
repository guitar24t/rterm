name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - name: Test rterm-connect.py
        if: runner.os == 'Linux'
        run: python3 -m unittest discover -s contrib -v

  # Windows as a host and as the computer, through a real OpenSSH server.
  ssh-windows:
    name: Test over ssh (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked
      - name: Package MSI
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          ./packaging/windows/build-msi.ps1 -Binary target/debug/rterm.exe -Arch x64 -Version (bash packaging/version.sh) -Out msi
      - name: Sessions, pickers and transfers over ssh
        shell: pwsh
        run: ./tests/windows-ssh.ps1 -Msi (Get-Item msi/*.msi).FullName

  # Build, sign (with a throwaway key) and install-test the packages on
  # every change, so a release can't be the first time packaging runs.
  packages:
    uses: ./.github/workflows/packages.yml
    with:
      release: false
