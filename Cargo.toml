[package]
name = "rterm"
version = "0.3.0"
edition = "2024"
description = "Persistent terminal sessions that behave like a plain terminal"
license = "MIT"
repository = "https://github.com/guitar24t/rterm"
homepage = "https://github.com/guitar24t/rterm"
readme = "README.md"
keywords = ["terminal", "ssh", "session", "detach", "tmux"]
categories = ["command-line-utilities"]

[dependencies]
alacritty_terminal = "0.26.0"
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
serde_json = "1.0.151"

[target.'cfg(unix)'.dependencies]
libc = "0.2.190"
nix = { version = "0.31.3", features = ["term", "poll", "signal", "process", "fs", "ioctl", "socket", "user"] }
signal-hook = "0.4.4"

[target.'cfg(windows)'.dependencies]
uds_windows = "1.2.1"
windows-sys = { version = "0.59.0", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.59.0", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[profile.release]
lto = true
codegen-units = 1
strip = true
